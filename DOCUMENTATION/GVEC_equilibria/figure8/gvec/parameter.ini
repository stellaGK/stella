! GVEC parameter file: figure-8 (trefoil-knot axis) stellarator
!
! This configuration uses the hmap_knot coordinate frame (which_hmap=10),
! giving an axis that follows a (2,3) torus-knot — a "figure-8"-like,
! self-knotted curve that VMEC cannot represent.
!
! nfp=3 means the knot curve has 3-fold symmetry; combined with the (2,3)
! winding numbers this gives the trefoil topology.
!
! Run with:
!   gvec parameter.ini
! Then post-process for stella:
!   python gvec_to_stella.py GVEC_FIG8_State_00001.dat \
!       --s 0.5 --nalpha 1 --nzgrid 192 --nfield_periods 3 \
!       -o ../gvec_stella_fig8.nc
!
! Note: VMEC CANNOT represent this geometry (non-toroidal axis), so no
! VMEC comparison is possible.  Instead, check that stella runs without
! errors and that the geometry is physically sensible (bmag > 0, etc.).

ProjectName = GVEC_FIG8

whichInitEquilibrium = 0

init_LA = T

! ── Discretisation ────────────────────────────────────────────────────────────
sgrid_nElems = 6
sgrid_grid_type = 0

degGP = 8

X1X2_deg  = 5
X1_mn_max = (/ 4, 0/)
X1_sin_cos = _cos_

X2_mn_max = (/ 4, 0/)
X2_sin_cos = _sin_

LA_deg    = 5
LA_mn_max = (/ 4, 0/)
LA_sin_cos = _sin_

fac_nyq = -1
mn_nyq  = (/9, 13/)

nfp = 3

! ── Hmap: trefoil-knot axis (figure-8 topology) ──────────────────────────────
which_hmap     = 10
hmap_knot_kl   = (/2, 3/)

! ── Boundary ─────────────────────────────────────────────────────────────────
X1_b_cos(1; 0) = 0.12
X2_b_sin(1; 0) = 0.18

X1_a_cos(0; 0) = 0.0

! ── Profiles ─────────────────────────────────────────────────────────────────
iota_type  = polynomial
iota_coefs = (/0.65/)
iota_scale = 1.0

pres_type  = polynomial
pres_coefs = (/0.0/)
pres_scale = 500.0

PhiEdge = 0.8

! ── Minimiser ─────────────────────────────────────────────────────────────────
maxiter       = 300
start_dt      = 0.5
logIter       = 50
minimize_tol  = 1.0e-10
PrecondType   = 1
MinimizerType = 0

! ── Output ───────────────────────────────────────────────────────────────────
which_visu  = 0
np_1d       = 5
outFileType = 12
SFLout      = 12
  SFLout_radialpos = (/0.25, 0.5, 0.75, 1.0/)
  SFLout_mn_max    = (/8, 8/)
  SFLout_mn_pts    = (/16, 12/)
